name: ember-and-oak

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-ember_and_oak}"
      POSTGRES_USER: "${POSTGRES_USER:-ember}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-local_only_password}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - ember_and_oak_postgres:/var/lib/postgresql/data

volumes:
  ember_and_oak_postgres:
